name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ajustar a las versiones declaradas en composer.json y package.json.
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  # Umbral de cobertura: el valor medido redondeado hacia abajo. Sube, nunca baja.
  COVERAGE_MIN: "94"

jobs:
  backend:
    name: Backend (Pint, Larastan, Pest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      # Después de instalar: artisan necesita vendor/autoload.php.
      - name: Copiar .env de pruebas
        run: cp .env.example .env && php artisan key:generate

      - name: Auditoría de dependencias
        run: composer audit

      - name: Formato (Pint)
        run: composer lint

      - name: Análisis estático (Larastan)
        run: composer analyse

      - name: Pruebas con cobertura
        run: vendor/bin/pest --coverage --min=${{ env.COVERAGE_MIN }}

      - name: Criterios de aceptación con prueba
        run: composer check:criteria

  frontend:
    name: Frontend (tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # El tema del panel (resources/css/filament/admin/theme.css) importa el CSS de
      # Filament desde vendor/: sin Composer, `npm run build` no lo encuentra.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
      - name: Instalar dependencias de PHP (solo el CSS de Filament)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --no-scripts

      - run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  secrets:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

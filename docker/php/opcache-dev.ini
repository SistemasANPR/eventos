; Solo desarrollo local (ADR-0008). El servidor es `php -S` (SAPI CLI), donde
; opcache viene apagado; sin el, cada peticion recompila vendor/ leido por 9p.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
; Revalida cambios de codigo cada 30 s; `docker compose restart app` los aplica ya.
opcache.validate_timestamps=1
opcache.revalidate_freq=30
realpath_cache_size=4096K
realpath_cache_ttl=600
